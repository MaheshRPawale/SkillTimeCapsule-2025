spring.application.name=SkillTimeCapsule
spring.datasource.url=jdbc:mysql://localhost:3306/avirat?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8080


#  JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT

jwt.secret=yourSecretKeyForJWTSigningAtLeast256BitsLong
jwt.expiration.ms=86400000  # 24 hours aahe he 
jwt.issuer=SkillTimeCapsule



# SPRING SECURITY
# =============================================
spring.security.user.name=admin
spring.security.user.password=adminpass
spring.security.user.roles=ADMIN





# SPRINGDOC OPENAPI (Swagger UI)
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.version=1.0.0
springdoc.packages-to-scan=com.skilltimecapsule.controller

# QUARTZ SCHEDULER (For Time Capsule Delivery)
# =============================================
spring.quartz.job-store-type=jdbc
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.isClustered=true


# LOGGING CONFIGURATION
# =============================================
logging.level.root=INFO
logging.level.com.skilltimecapsule=DEBUG
logging.file.name=logs/skilltime-capsule.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n






# CORS CONFIGURATION (For React Frontend)
# =============================================
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true















